services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelnet}
      POSTGRES_USER: ${POSTGRES_USER:-travelnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travelnet} -d ${POSTGRES_DB:-travelnet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "dist/scripts/db-migrate.js"]
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "dist/server/src/index.js"]
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-travelnet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-travelnet}
      PORT: 3000
      HOST: 0.0.0.0
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    environment:
      API_INTERNAL_URL: http://api:3000
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    ports:
      - "8080:3000"

  seed:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "dist/scripts/db-seed.js"]
    env_file:
      - .env.docker
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pg_data:
  uploads_data:
