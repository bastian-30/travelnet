name: travelnet

x-api-build: &api-build
  context: .
  dockerfile: docker/api.Dockerfile

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-db-environment: &db-environment
  DATABASE_URL: "postgresql://${POSTGRES_USER:-travelnet}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-travelnet}"

x-api-environment: &api-environment
  <<: *db-environment
  NODE_ENV: production
  PORT: "3000"
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-travelnet-53faa}
  STREAM_KEY_ENCRYPTION_KEY: ${STREAM_KEY_ENCRYPTION_KEY:?Define STREAM_KEY_ENCRYPTION_KEY}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080,http://localhost:8443,http://127.0.0.1:8443}
  ANT_MEDIA_URL: ${ANT_MEDIA_URL:-http://127.0.0.1:5080}
  ANT_MEDIA_APP: ${ANT_MEDIA_APP:-LiveApp}
  ANT_MEDIA_RTMP_URL: ${ANT_MEDIA_RTMP_URL:-rtmp://127.0.0.1:1935}
  ANT_MEDIA_HLS_URL: ${ANT_MEDIA_HLS_URL:-http://127.0.0.1:5080/LiveApp/streams}
  ANT_MEDIA_WEBRTC_URL: ${ANT_MEDIA_WEBRTC_URL:-http://127.0.0.1:5080/LiveApp/play.html?name=}
  ANT_MEDIA_WEBHOOK_SECRET: ${ANT_MEDIA_WEBHOOK_SECRET:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelnet}
      POSTGRES_USER: ${POSTGRES_USER:-travelnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  migrate:
    build: *api-build
    image: travelnet-api:local
    command: ["node", "dist/scripts/db-migrate.js"]
    environment: *db-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    build: *api-build
    image: travelnet-api:local
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/}
    image: travelnet-web:local
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:3000"
    logging: *default-logging

  seed:
    profiles: ["tools"]
    build: *api-build
    image: travelnet-api:local
    command: ["node", "dist/scripts/db-seed.js"]
    environment: *db-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  adminer:
    profiles: ["tools"]
    image: adminer:4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    logging: *default-logging

volumes:
  postgres_data:
